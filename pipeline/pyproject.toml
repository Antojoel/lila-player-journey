[project]
name = "lila-pipeline"
version = "1.0.0"
description = "LILA BLACK player-journey precompute pipeline"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.5", "pandas>=2.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # long lines in docstrings/comments are fine

[tool.ruff.format]
quote-style = "double"
