# Two independent pieces:
#
#   docker compose up web                     serve the site on http://localhost:8080
#   PLAYER_DATA_DIR=/abs/path/to/player_data \
#     docker compose run --rm pipeline         bake web/public/data as a bundled dataset
#
# The app is upload-driven (drop a zip in the browser). The "pipeline" service is
# optional and profile-gated — it only exists to pre-bake a dataset the app loads
# on boot, e.g. for a demo deploy, or to process a dataset too big for a tab.

services:
  web:
    build: ./web
    image: lila-web
    ports:
      - "8080:80"

  pipeline:
    build: ./pipeline
    image: lila-pipeline
    profiles: ["tools"]
    volumes:
      # Point PLAYER_DATA_DIR at your unzipped dataset (absolute path), or drop
      # it at ./player_data (git-ignored) and leave this default.
      - ${PLAYER_DATA_DIR:-./player_data}:/data:ro
      - ./web/public:/out
