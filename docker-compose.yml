# Two independent pieces:
#
#   docker compose up web                     serve the site on http://localhost:8080
#   PLAYER_DATA_DIR=/abs/path/to/player_data \
#     docker compose run --rm pipeline         regenerate web/public/data + minimaps
#
# The "pipeline" service is under a profile so `compose up` never runs it — the
# generated data is committed, so the site works without touching the raw files.

services:
  web:
    build: ./web
    image: lila-web
    ports:
      - "8080:80"

  pipeline:
    build: ./pipeline
    image: lila-pipeline
    profiles: ["tools"]
    volumes:
      # Point PLAYER_DATA_DIR at your unzipped dataset (absolute path), or drop
      # it at ./player_data (git-ignored) and leave this default.
      - ${PLAYER_DATA_DIR:-./player_data}:/data:ro
      - ./web/public:/out
